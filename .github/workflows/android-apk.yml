name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mrbzr66 .
          fi
      - name: Install dependencies
        run: flutter pub get
      - name: Configure stable release signing
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildTypes {"
          signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                      storeFile = file("upload-keystore.jks")
                      storePassword = System.getenv("ANDROID_STORE_PASSWORD")
                  }
              }

          '''
          if 'create("release")' not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildTypes block in generated Gradle file")
              s = s.replace(marker, signing + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                        'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        run: flutter build apk --release
      - name: Build debug APK (first-run smoke test only)
        if: env.HAS_SIGNING_KEY != 'true'
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_SIGNING_KEY == 'true' && 'knowme-release-signed' || 'knowme-debug-smoke-test-not-for-updates' }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
